<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tadashi Suto - Cyberpunk CV</title>
  
  <!-- React e ReactDOM via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel para JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Fontes cyberpunk -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <style>
    /* ESTILOS COMPLETOS - COLE AQUI TODO O CSS QUE TE MANDEI ANTES */
    /* Por questão de espaço, mantenha o mesmo CSS da mensagem anterior */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Share Tech Mono', monospace;
      background: #0a0a0f;
      color: #00ffff;
    }
    .cyberpunk-wrapper {
      position: relative;
      min-height: 100vh;
      background: linear-gradient(135deg, #000000 0%, #0a0a1f 100%);
    }
    .cyber-main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 10;
    }
    /* Scanline effect */
    .scanline {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, transparent 50%, rgba(0, 255, 255, 0.03) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      animation: scan 8s linear infinite;
      z-index: 9999;
    }
    @keyframes scan {
      0% { background-position: 0 0; }
      100% { background-position: 0 100%; }
    }
    /* Matrix rain */
    .matrix-rain {
      position: fixed;
      top: -100%;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(0deg, 
        rgba(0, 255, 255, 0.02) 0px, 
        transparent 2px, 
        rgba(0, 255, 255, 0.02) 4px,
        transparent 6px);
      animation: matrix 20s linear infinite;
      pointer-events: none;
      z-index: 1;
    }
    @keyframes matrix {
      from { transform: translateY(0); }
      to { transform: translateY(100%); }
    }
    /* Header */
    .cyber-header {
      text-align: center;
      margin: 30px 0;
      padding: 20px;
      border: 2px solid #00ffff;
      background: rgba(0, 255, 255, 0.02);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
    }
    .glitch {
      font-size: 4rem;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      position: relative;
      color: white;
      letter-spacing: 5px;
      animation: glitch-skew 4s infinite;
    }
    @media (max-width: 768px) {
      .glitch { font-size: 2.2rem; }
    }
    .glitch::before,
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .glitch::before {
      animation: glitch-anim 3s infinite linear alternate-reverse;
      color: #ff00ff;
      z-index: -1;
    }
    .glitch::after {
      animation: glitch-anim2 2s infinite linear alternate-reverse;
      color: #00ffff;
      z-index: -2;
    }
    @keyframes glitch-anim {
      0% { clip-path: inset(20% 0 30% 0); transform: translate(-2px, 2px); }
      20% { clip-path: inset(50% 0 10% 0); transform: translate(2px, -2px); }
      40% { clip-path: inset(10% 0 60% 0); transform: translate(-2px, 2px); }
      60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
      80% { clip-path: inset(30% 0 40% 0); transform: translate(-2px, 2px); }
      100% { clip-path: inset(70% 0 15% 0); transform: translate(2px, -2px); }
    }
    .status-bar {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 25px 0;
      flex-wrap: wrap;
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 255, 255, 0.1);
      padding: 8px 16px;
      border: 1px solid #00ffff;
      border-radius: 4px;
    }
    .status-led {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: blink 2s infinite;
    }
    .status-led.red { background: #ff0000; box-shadow: 0 0 10px #ff0000; }
    .status-led.green { background: #00ff00; box-shadow: 0 0 10px #00ff00; }
    .status-led.blue { background: #00ffff; box-shadow: 0 0 10px #00ffff; }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .neon-text {
      color: #00ffff;
      text-shadow: 0 0 5px #00ffff;
    }
    .title-container {
      margin: 20px 0;
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }
    .cyber-title {
      color: #ff00ff;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.3rem;
      letter-spacing: 3px;
      text-shadow: 0 0 10px #ff00ff;
      border: 1px solid #ff00ff;
      padding: 5px 15px;
      background: rgba(255, 0, 255, 0.05);
    }
    /* Terminal */
    .terminal-window {
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid #00ffff;
      border-radius: 8px;
      margin: 30px 0;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
      overflow: hidden;
    }
    .terminal-header {
      background: #001111;
      padding: 10px 15px;
      border-bottom: 1px solid #00ffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .terminal-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .terminal-dot.red { background: #ff5f56; }
    .terminal-dot.yellow { background: #ffbd2e; }
    .terminal-dot.green { background: #27c93f; }
    .terminal-title {
      color: #00ffff;
      margin-left: 10px;
    }
    .terminal-body {
      padding: 20px;
      min-height: 120px;
    }
    .terminal-line {
      color: #00ff00;
      margin: 8px 0;
      animation: fadeIn 0.5s;
    }
    .prompt {
      color: #00ffff;
      margin-right: 10px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* Grid */
    .cyber-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
      margin: 40px 0;
    }
    @media (max-width: 768px) {
      .cyber-grid {
        grid-template-columns: 1fr;
      }
    }
    .cyber-card {
      background: rgba(0, 10, 20, 0.9);
      border: 2px solid #00ffff;
      padding: 20px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      transition: 0.3s;
    }
    .cyber-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
    }
    .cyber-card h3 {
      color: #00ffff;
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      margin-bottom: 20px;
      font-size: 1.5rem;
      text-shadow: 0 0 10px #00ffff;
    }
    /* Skill Tree */
    .skill-node {
      margin: 15px 0;
      padding: 12px;
      background: rgba(0, 255, 255, 0.03);
      border-left: 4px solid;
      transition: 0.3s;
      position: relative;
    }
    .skill-node:hover {
      background: rgba(0, 255, 255, 0.1);
      padding-left: 20px;
    }
    .skill-node.legendary { border-color: #ffaa00; }
    .skill-node.epic { border-color: #aa00ff; }
    .skill-node.rare { border-color: #00aaff; }
    .skill-name {
      display: block;
      color: white;
      font-family: 'Orbitron', sans-serif;
      margin-bottom: 8px;
    }
    .skill-bar-cyber {
      width: 100%;
      height: 20px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid #00ffff;
      overflow: hidden;
    }
    .skill-fill {
      height: 100%;
      background: linear-gradient(90deg, #00ffff, #ff00ff);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
      animation: fillBar 1s ease-out;
    }
    @keyframes fillBar {
      from { width: 0; }
    }
    .skill-value {
      color: white;
      font-size: 11px;
    }
    .skill-tooltip {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #001111;
      border: 1px solid #00ffff;
      padding: 8px;
      color: white;
      z-index: 100;
    }
    /* Missions */
    .mission-item {
      margin: 15px 0;
      padding: 15px;
      background: rgba(0, 255, 255, 0.05);
      border: 1px solid #00ffff;
    }
    .mission-name {
      color: #ff00ff;
      font-size: 1.2rem;
      font-family: 'Orbitron', sans-serif;
    }
    .mission-company {
      color: #00ffff;
      margin: 5px 0;
    }
    .mission-objectives {
      margin: 10px 0;
      padding-left: 20px;
      color: white;
    }
    .mission-xp {
      color: #00ff00;
      text-align: right;
    }
    .mission-progress {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
    }
    .progress-bar {
      flex: 1;
      height: 10px;
      background: #001111;
      border: 1px solid #00ffff;
    }
    .progress-fill {
      height: 100%;
      background: #00ffff;
    }
    /* Achievements */
    .achievement-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .achievement-item {
      padding: 10px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid;
      text-align: center;
      transition: 0.3s;
    }
    .achievement-item:hover {
      transform: scale(1.05);
    }
    .achievement-icon {
      font-size: 2rem;
      margin-bottom: 5px;
    }
    .achievement-name {
      font-size: 0.9rem;
      margin-bottom: 5px;
    }
    .achievement-rarity {
      font-size: 0.7rem;
    }
    /* Contact */
    .contact-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .contact-link {
      color: #00ffff;
      text-decoration: none;
      padding: 10px 20px;
      border: 1px solid #00ffff;
      transition: 0.3s;
    }
    .contact-link:hover {
      background: #00ffff;
      color: #000;
      box-shadow: 0 0 20px #00ffff;
    }
    .corp-id {
      text-align: center;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #00ffff;
    }
    /* Hack button */
    .hack-prompt {
      text-align: center;
      margin: 60px 0;
      padding: 40px;
      border: 2px solid #ff00ff;
      background: rgba(255, 0, 255, 0.05);
      box-shadow: 0 0 40px rgba(255, 0, 255, 0.3);
    }
    .glitch-text {
      font-size: 1.8rem;
      color: #ff00ff;
      animation: glitchText 3s infinite;
      margin-bottom: 30px;
    }
    @keyframes glitchText {
      0%, 100% { text-shadow: 2px 0 #ff00ff, -2px 0 #00ffff; }
      50% { text-shadow: -2px 0 #ff00ff, 2px 0 #00ffff; }
    }
    .cyber-button {
      background: transparent;
      border: 2px solid #00ffff;
      color: #00ffff;
      padding: 15px 40px;
      font-size: 1.2rem;
      font-family: 'Orbitron', sans-serif;
      text-transform: uppercase;
      letter-spacing: 4px;
      cursor: pointer;
      transition: 0.3s;
    }
    .cyber-button:hover {
      background: #00ffff;
      color: #000;
      box-shadow: 0 0 50px #00ffff;
      transform: scale(1.05);
    }
    .secret-message {
      text-align: center;
      margin: 40px 0;
      animation: fadeIn 1s;
    }
    .secret-message h2 {
      color: #ff00ff;
      font-size: 2rem;
      margin-bottom: 20px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // TODOS OS DADOS ESTÃO AQUI DENTRO - NÃO PRECISA DE ARQUIVOS EXTERNOS!
    
    // ========== DADOS ==========
    const skillsData = [
      { name: 'PRODUCT OWNER', level: 95, type: 'legendary', description: '🎯 Priorização • Visão de produto • ROI • Roadmaps' },
      { name: 'GESTÃO DE PROJETOS', level: 92, type: 'legendary', description: '📊 Sprints • Prazos • Recursos • Metodologias Ágeis' },
      { name: 'INTEGRAÇÕES', level: 88, type: 'epic', description: '🔌 APIs • Web Services • Aéreas • Hotéis • Backoffices' },
      { name: 'UX RESEARCH', level: 82, type: 'rare', description: '🧠 Pós-graduação • Prototipação • Jornada do usuário' },
      { name: 'LIDERANÇA', level: 90, type: 'epic', description: '👥 Gestão de equipes • Mentoria • Desenvolvimento de pessoas' },
      { name: 'FINANÇAS', level: 85, type: 'epic', description: '💰 Cartões corporativos • Despesas • ROI • Orçamentos' }
    ];

    const missionsData = [
      {
        id: 1,
        name: 'BUSINESS PARTNER',
        company: 'AVIPAM Viagens & Turismo',
        period: '2025-presente',
        xp: 3000,
        objectives: [
          'Conectar tecnologia aos objetivos de negócio',
          'Planejar novos desenvolvimentos',
          'Validar entregas com stakeholders'
        ],
        progress: 70
      },
      {
        id: 2,
        name: 'GERENTE DE PROJETOS',
        company: 'Lemontech',
        period: '2022-2025',
        xp: 2500,
        objectives: [
          'Liderar implementação de produto de despesas',
          'Integrar com aéreas, hotéis e backoffices',
          'Gerenciar equipe de 3 analistas + QA'
        ]
      },
      {
        id: 3,
        name: 'PRODUCT OWNER',
        company: 'Lemontech',
        period: '2018-2022',
        xp: 1000,
        objectives: [
          'Analisar e prototipar features',
          'Gerenciar backlog do produto',
          'Acompanhar implantações'
        ]
      },
      {
        id: 4,
        name: 'COORDENADOR DE SUPORTE',
        company: 'Lemontech',
        period: '2015-2018',
        xp: 500,
        objectives: [
          'Otimizar processos de suporte',
          'Resolver questões complexas',
          'Implementar melhores práticas'
        ]
      }
    ];

    const achievementsData = [
      { name: '🌉 CONSTRUTOR DE PONTES', rarity: 'LENDÁRIO', icon: '🔌', color: '#ffaa00', description: 'Integrou 5+ sistemas' },
      { name: '⚡ MESTRE DOS SPRINTS', rarity: 'ÉPICO', icon: '📊', color: '#aa00ff', description: '50+ sprints entregues' },
      { name: '🧠 ARQUITETO NEURAL', rarity: 'RARO', icon: '🎨', color: '#00aaff', description: 'Pós em UX' },
      { name: '💳 HACKER FINANCEIRO', rarity: 'ÉPICO', icon: '💰', color: '#00ffaa', description: 'Sistema de despesas' },
      { name: '🗣️ POLIGLOTA', rarity: 'MÍTICO', icon: '🔤', color: '#ff00aa', description: 'Dev, Business, UX' },
      { name: '👥 MENTOR', rarity: 'LENDÁRIO', icon: '⭐', color: '#ffaa00', description: '10+ profissionais' }
    ];

    // ========== COMPONENTES ==========
    
    // Header Component
    function CyberHeader() {
      const [time, setTime] = React.useState(new Date());
      
      React.useEffect(() => {
        const timer = setInterval(() => setTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      return (
        <header className="cyber-header">
          <h1 className="glitch" data-text="TADASHI SUTO">TADASHI SUTO</h1>
          
          <div className="status-bar">
            <div className="status-item">
              <span className="status-led red"></span>
              <span className="neon-text">LIVE</span>
            </div>
            <div className="status-item">
              <span className="status-led green"></span>
              <span className="neon-text">LVL 42</span>
            </div>
            <div className="status-item">
              <span className="status-led blue"></span>
              <span className="neon-text">SYNC</span>
            </div>
            <div className="status-item">
              <span className="neon-text">{time.toLocaleTimeString()}</span>
            </div>
          </div>

          <div className="title-container">
            <h2 className="cyber-title">BUSINESS PARTNER</h2>
            <h2 className="cyber-title">PRODUCT OWNER</h2>
          </div>
        </header>
      );
    }

    // Terminal Component
    function TerminalWindow({ lines }) {
      return (
        <div className="terminal-window">
          <div className="terminal-header">
            <span className="terminal-dot red"></span>
            <span className="terminal-dot yellow"></span>
            <span className="terminal-dot green"></span>
            <span className="terminal-title">root@tadashi:~#</span>
          </div>
          <div className="terminal-body">
            {lines.map((line, index) => (
              <p key={index} className="terminal-line">
                <span className="prompt">$></span> {line}
              </p>
            ))}
          </div>
        </div>
      );
    }

    // SkillTree Component
    function SkillTree() {
      const [selectedSkill, setSelectedSkill] = React.useState(null);

      return (
        <div className="cyber-card">
          <h3>⚡ NEURAL IMPLANTS</h3>
          {skillsData.map(skill => (
            <div 
              key={skill.name} 
              className={`skill-node ${skill.type}`}
              onMouseEnter={() => setSelectedSkill(skill)}
              onMouseLeave={() => setSelectedSkill(null)}
            >
              <span className="skill-name">{skill.name}</span>
              <div className="skill-bar-cyber">
                <div className="skill-fill" style={{width: `${skill.level}%`}}>
                  <span className="skill-value">{skill.level}%</span>
                </div>
              </div>
              {selectedSkill === skill && (
                <div className="skill-tooltip">{skill.description}</div>
              )}
            </div>
          ))}
        </div>
      );
    }

    // Missions Component
    function Missions() {
      return (
        <div className="cyber-card">
          <h3>🎯 MISSÕES PRINCIPAIS</h3>
          {missionsData.map(mission => (
            <div key={mission.id} className="mission-item">
              <div className="mission-name">{mission.name}</div>
              <div className="mission-company">{mission.company} | {mission.period}</div>
              <ul className="mission-objectives">
                {mission.objectives.map((obj, i) => (
                  <li key={i}>{obj}</li>
                ))}
              </ul>
              {mission.progress && (
                <div className="mission-progress">
                  <div className="progress-bar">
                    <div className="progress-fill" style={{width: `${mission.progress}%`}}></div>
                  </div>
                  <span>{mission.progress}%</span>
                </div>
              )}
              <div className="mission-xp">+{mission.xp} XP</div>
            </div>
          ))}
        </div>
      );
    }

    // Achievements Component
    function Achievements() {
      return (
        <div className="cyber-card">
          <h3>🏆 CONQUISTAS</h3>
          <div className="achievement-grid">
            {achievementsData.map((ach, index) => (
              <div key={index} className="achievement-item" style={{borderColor: ach.color}}>
                <div className="achievement-icon">{ach.icon}</div>
                <div className="achievement-name">{ach.name}</div>
                <div className="achievement-rarity" style={{color: ach.color}}>{ach.rarity}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Contact Component
    function Contact() {
      return (
        <div className="cyber-card">
          <h3>📡 CONEXÕES</h3>
          <div className="contact-links">
            <a href="https://www.linkedin.com/in/tadashi-suto/" target="_blank" rel="noopener noreferrer" className="contact-link">
              LINKEDIN
            </a>
            <a href="https://github.com/tadashijr" target="_blank" rel="noopener noreferrer" className="contact-link">
              GITHUB
            </a>
            <a href="mailto:tadashi.suto@gmail.com" className="contact-link">
              EMAIL
            </a>
          </div>
          <div className="corp-id">
            <span>ID: T4D4SH1_42 | CORP: AVIPAM/LEMONTECH</span>
          </div>
          <div style={{textAlign: 'center', marginTop: '10px', color: '#ff00ff'}}>
            ⚡ Pós em UX • Gestão de TI ⚡
          </div>
        </div>
      );
    }

    // Main App Component
    function App() {
      const [hacked, setHacked] = React.useState(false);
      const [terminalLines, setTerminalLines] = React.useState([
        'INICIALIZANDO SISTEMA...',
        'CARREGANDO PERFIL DO NETRUNNER...',
        'CONEXÃO ESTABELECIDA',
        'BEM-VINDO, TADASHI SUTO',
        'NÍVEL DE ACESSO: BUSINESS PARTNER'
      ]);

      React.useEffect(() => {
        const interval = setInterval(() => {
          setTerminalLines(prev => {
            const newLines = [
              ...prev.slice(-4),
              `${new Date().toLocaleTimeString()} - SYNC: ${Math.floor(90 + Math.random() * 10)}%`
            ];
            return newLines;
          });
        }, 6000);

        return () => clearInterval(interval);
      }, []);

      return (
        <div className="cyberpunk-wrapper">
          <div className="scanline"></div>
          <div className="crt-effect"></div>
          <div className="matrix-rain"></div>
          
          <main className="cyber-main">
            <CyberHeader />
            <TerminalWindow lines={terminalLines} />
            
            <div className="cyber-grid">
              <SkillTree />
              <Missions />
              <Achievements />
              <Contact />
            </div>

            {!hacked ? (
              <div className="hack-prompt">
                <p className="glitch-text">⛔ ACESSO RESTRITO</p>
                <button className="cyber-button" onClick={() => setHacked(true)}>
                  HACK THE SYSTEM
                </button>
              </div>
            ) : (
              <div className="secret-message">
                <h2>🔓 ACESSO CONCEDIDO</h2>
                <p style={{color: '#00ffff', fontSize: '1.2rem'}}>
                  Bem-vindo ao mainframe, netrunner. Explore meus projetos no GitHub!
                </p>
              </div>
            )}
          </main>
        </div>
      );
    }

    // Renderizar o App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
